<ui:composition
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:composite="http://xmlns.jcp.org/jsf/composite"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:f="http://xmlns.jcp.org/jsf/core"
    xmlns:pt="http://xmlns.jcp.org/jsf/passthrough"
    xmlns:jsf="http://xmlns.jcp.org/jsf"
    xmlns:util="http://goobi.io/util">

    <composite:interface>
    </composite:interface>

    <composite:implementation>
        <div id="image-control-wrapper d-flex flex-nowrap">
            <nav id="viewer_controls_nav">
                <ul>

                    <li>
                        <span
                            class="btn btn-blank me-1"
                            title="#{msgs.plugin_intranda_step_imageQA_rotateLeft}"
                            data-bs-toggle="tooltip"
                            id="mainImageRotateLeft"
                            jsf:rendered="#{! AktuelleSchritteForm.myPlugin.allowPersistentRotation}">
                            <util:icon icon="rotate" />
                        </span>
                        <button
                            class="btn btn-blank me-1"
                            title="#{msgs.plugin_intranda_step_imageQA_rotateLeft}"
                            data-bs-toggle="tooltip"
                            jsf:rendered="#{AktuelleSchritteForm.myPlugin.allowPersistentRotation}"
                            jsf:action="#{AktuelleSchritteForm.myPlugin.rotateCurrentImageToLeft}">
                            <util:icon icon="rotate" />
                        </button>
                    </li>
                    <li>
                        <span
                            class="btn btn-blank me-3"
                            title="#{msgs.plugin_intranda_step_imageQA_rotateRight}"
                            data-bs-toggle="tooltip"
                            id="mainImageRotateRight"
                            jsf:rendered="#{! AktuelleSchritteForm.myPlugin.allowPersistentRotation}">
                            <util:icon icon="rotate-clockwise" />
                        </span>
                        <button
                            class="btn btn-blank me-3"
                            title="#{msgs.plugin_intranda_step_imageQA_rotateRight}"
                            data-bs-toggle="tooltip"
                            jsf:rendered="#{AktuelleSchritteForm.myPlugin.allowPersistentRotation}"
                            jsf:action="#{AktuelleSchritteForm.myPlugin.rotateCurrentImageToRight}">
                            <util:icon icon="rotate-clockwise" />
                        </button>
                    </li>
                    <li>
                        <button
                            class="btn btn-blank me-1"
                            title="#{msgs.imageFullscreen}"
                            data-bs-toggle="tooltip"
                            jsf:action="ImageQAPlugin_Fullscreen"
                            jsf:rendered="#{! AktuelleSchritteForm.myPlugin.useJSFullscreen}">
                            <util:icon icon="arrows-maximize" />
                        </button>
                    	<button
                    		class="btn btn-blank me-1"
                    		title="#{msgs.imageFullscreen}"
                            data-bs-toggle="tooltip"
							jsf:action="ImageQAPlugin_JSFullscreen"
							jsf:rendered="#{AktuelleSchritteForm.myPlugin.useJSFullscreen}">
                            <util:icon icon="arrows-maximize" />
						</button>
                    </li>
                    <li>
                        <button
                            class="btn btn-blank me-1"
                            jsf:rendered="#{AktuelleSchritteForm.myPlugin.displayOcrButton}"
                            title="Show OCR-result"
                            data-bs-toggle="tooltip"
                            jsf:action="#{AktuelleSchritteForm.myPlugin.toggleOCR()}">
                            <util:icon icon="file-text" />
                        </button>
                    </li>
                    <li>
                        <span
                            class="btn btn-blank me-1"
                            title="#{msgs.resetImage}"
                            data-bs-toggle="tooltip"
                            id="mainImageResetView">
                            <util:icon icon="refresh" />
                        </span>
                    </li>

                    <li>
                        <div
                            id="zoomSliderLabel"
                            class="form-control d-flex flex-nowrap align-items-center">
                            <input aria-label="#{msgs.sizeOfImages}" ></input>
                            <span>%</span>
                        </div>
                        <input id="zoomSlider" aria-label="zoomSlider" class="zoom-slider" type="range" min="0" max="1" step="0.01"/>
                    </li>
                    <li>
                        <button
                            id="zoomLockToggle"
                            type="button"
                            class="btn btn-blank ms-1"
                            title="#{msgs.plugin_intranda_step_imageQA_zoomLock}"
                            data-bs-toggle="tooltip"
                            onclick="toggleZoomPersistence()">
                            <util:icon icon="lock" styleClass="zoom-locked" />
                            <util:icon icon="lock-open" styleClass="zoom-unlocked d-none" />
                        </button>
                    </li>
                </ul>
            </nav>
        </div>
    </composite:implementation>
</ui:composition>
